<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Budget Talk – image de partage</title>
<!-- Source de liens/og.jpg (1200x630). Régénérer : node liens/tests/check.js <dossier> --og -->
<style>
  @font-face { font-family: "BT Display"; src: url(../fonts/montserrat-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
  @font-face { font-family: "BT Display"; src: url(../fonts/montserrat-latin-900-normal.woff2) format("woff2"); font-weight: 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: radial-gradient(ellipse 80% 70% at 25% 15%, #1E2C57 0%, #0B1226 55%, #060914 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .glow {
    position: absolute; width: 760px; height: 760px; right: -220px; bottom: -380px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,0,.16), transparent 65%);
  }
  .content {
    position: absolute; inset: 0;
    display: flex; align-items: center; gap: 64px;
    padding: 0 96px;
  }
  .mono {
    flex: none; width: 260px; height: 260px; border-radius: 50%; object-fit: cover; display: block;
    box-shadow: 0 0 0 10px #0B1226, 0 0 0 14px rgba(255,200,0,.35), 0 30px 80px rgba(255,200,0,.22);
  }
  .kicker {
    font-weight: 700; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: #FFC800;
  }
  h1 {
    margin-top: 14px;
    font-family: "BT Display", sans-serif; font-weight: 900; font-size: 104px; line-height: 1; letter-spacing: -2px;
  }
  .tagline { margin-top: 26px; font-size: 40px; font-weight: 500; color: rgba(255,255,255,.78); line-height: 1.25; }
  .band {
    display: inline-block; margin-top: 34px;
    font-family: "BT Display", sans-serif; font-weight: 900; font-size: 30px; letter-spacing: .01em;
    padding: 12px 20px 11px; background: #FFC800; color: #0A0E1C; box-shadow: 6px 6px 0 rgba(0,0,0,.35);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="content">
    <img class="mono" src="../avatar.jpg" width="260" height="260" alt="">
    <div>
      <p class="kicker">Chaîne YouTube</p>
      <h1>Budget Talk</h1>
      <p class="tagline">Ton budget, expliqué simplement.</p>
      <p class="band">@BudgetTalk_FR</p>
    </div>
  </div>
</body>
</html>
